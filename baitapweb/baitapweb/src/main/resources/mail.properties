# ===== CẤU HÌNH GỬI MAIL (sửa 3 dòng bên dưới) =====
# Tài khoản Gmail dùng để gửi
mail.username=your_account@gmail.com
# Mật khẩu ỨNG DỤNG 16 ký tự của Gmail (không phải mật khẩu đăng nhập)
mail.password=xxxxxxxxxxxxxxxx
# Email nhận thông báo mỗi khi có người đăng ký (có thể trùng mail.username)
mail.to=your_email@gmail.com

mail.smtp.host=smtp.gmail.com
mail.smtp.port=587
